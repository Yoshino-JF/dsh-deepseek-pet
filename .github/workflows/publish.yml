name: Publish to npm

# 通过 GitHub OIDC 身份向 npm 发布（Trusted Publishing）——
# 不需要任何 npm token、不需要 OTP、不需要账号开启 2FA。
#
# 触发方式（二选一）：
#   1) 推送形如 v0.2.6 的 tag  → 自动发布
#   2) 手动触发并指定 tag      → 用于重跑某个已存在的 tag
#
# 前置（npm 侧一次性配置，见仓库文档）：
#   包 Settings → Trusted Publisher → GitHub Actions
#     Organization or user : Yoshino-JF
#     Repository           : dsh-deepseek-pet
#     Workflow filename    : publish.yml
#     Environment name     : （留空）
#     Allowed action       : 勾选 npm publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的已存在 tag（例如 v0.2.6）'
        required: true

permissions:
  contents: read
  id-token: write # OIDC 换取 npm 短期凭据所必需

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.tag }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # 需要 npm >= 11.5.1 才支持 OIDC 可信发布
          node-version: 24
          registry-url: https://registry.npmjs.org

      # 故意不设置 NODE_AUTH_TOKEN —— npm 会自动识别 GitHub OIDC 上下文。
      # 一旦设置 token，就会退回 token 发布路径，失去可信发布的意义。

      - name: Report toolchain
        run: |
          node --version
          npm --version

      - name: Verify tag matches package version
        run: |
          TAG="${{ steps.ref.outputs.tag }}"
          PKG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG  package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag ($TAG) 与 package.json 版本 ($PKG) 不一致，拒绝发布"
            exit 1
          fi

      - name: Install YAML parser for the bundle-patch guard
        # 这个守卫需要真正的 YAML 解析器。原先误写成 node:util 的 parse
        # （那是解析 --key=value 命令行字符串的，且 ESM 下根本没有该导出），
        # 导致本步骤必然在模块加载期失败 —— 任何 tag 都发不出去。
        run: npm install --no-save --no-package-lock js-yaml

      - name: Verify bundle patch parses and name matches package name
        run: |
          node --input-type=module -e "
          import fs from 'node:fs';
          import { createRequire } from 'node:module';
          const yaml = createRequire(import.meta.url)('js-yaml');
          const src = fs.readFileSync('cordis.patch.yml', 'utf8');
          const doc = yaml.load(src);                    // 真正用 YAML 解析，不是正则
          const rows = Array.isArray(doc) ? doc.flatMap((r) => r.insert ?? []) : [];
          const row = rows.find((r) => r && r.name);
          if (!row) { console.error('::error::cordis.patch.yml 里找不到带 name 的 insert 行'); process.exit(1); }
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8')).name;
          console.log('package.json.name      = ' + pkg);
          console.log('cordis.patch.yml.name  = ' + row.name);
          if (pkg !== row.name) {
            console.error('::error::二者不一致 —— 会导致插件 failed to import');
            process.exit(1);
          }
          if (!row.name.startsWith('@')) return;
          console.log('::notice::带 @ 的包名在 YAML 里必须加引号，已能解析，OK');
          "

      - name: Verify pet payload is present
        run: |
          test -f pet/DeepSeekPet.exe || { echo "::error::pet/DeepSeekPet.exe 缺失 —— GitHub 安装会缺桌宠本体"; exit 1; }
          ls -l pet/DeepSeekPet.exe

      - name: Publish
        run: npm publish --access public

      - name: Verify tarball is downloadable
        run: |
          PKG_NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          SHORT="${PKG_NAME#@}"
          BASE="${SHORT##*/}"
          URL="https://registry.npmjs.org/${PKG_NAME}/-/${BASE}-${VERSION}.tgz"
          echo "GET $URL"
          # 实测：元数据提交是即时的，但 CDN 上架 tarball 存在明显延迟，
          # 观测到的数值为 4~15 分钟（0.2.4 / 0.2.5 / 0.2.6 均如此）。
          # 因此窗口设为 20 分钟，避免把「延迟」误判成「失败」。
          for i in $(seq 1 20); do
            CODE="$(curl -s -o /dev/null -w '%{http_code}' "$URL")"
            echo "attempt $i/20 ($(( i * 60 / 60 )) 分钟内) -> HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "tarball 已可下载 ✅"
              exit 0
            fi
            sleep 60
          done
          echo "::error::tarball 在 20 分钟内仍不可下载（$URL）"
          echo "::error::注意：此时 npm publish 通常已成功提交元数据，dist-tag 已指向本版本但 blob 缺失。"
          echo "::error::处置：先把 dist-tag latest 退回上一个可用版本，再排查，切勿直接重复发布同版本号。"
          exit 1

      - name: Warn if dist-tag points at a version whose tarball is missing
        if: failure()
        run: |
          PKG_NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          echo "::warning::发布流程失败，请人工确认 $PKG_NAME@$VERSION 的 tarball 是否可下载，以及 dist-tags.latest 是否指向可用版本。"
